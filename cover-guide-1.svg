<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#171c2a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d77e"/>
      <stop offset="50%" stop-color="#f5b833"/>
      <stop offset="100%" stop-color="#d99e1f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- decorative corner frames -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <path d="M 60 60 L 60 120 M 60 60 L 120 60"/>
    <path d="M 1140 60 L 1140 120 M 1140 60 L 1080 60"/>
    <path d="M 60 570 L 60 510 M 60 570 L 120 570"/>
    <path d="M 1140 570 L 1140 510 M 1140 570 L 1080 570"/>
  </g>
  <rect x="45" y="45" width="1110" height="540" rx="4" fill="none" stroke="#2a3142" stroke-width="1"/>

  <!-- badge -->
  <rect x="500" y="95" width="200" height="36" rx="18" fill="#2a2416"/>
  <text x="600" y="119" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#f5b833" text-anchor="middle" font-weight="bold">دليل رقمي PDF</text>

  <!-- title -->
  <text x="600" y="230" font-family="Tahoma, Arial, sans-serif" font-size="58" fill="#f2f0ea" text-anchor="middle" font-weight="bold">احترف الفوتوشوب</text>
  <text x="600" y="300" font-family="Tahoma, Arial, sans-serif" font-size="58" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">وابدأ العمل الحر</text>

  <!-- divider -->
  <line x1="450" y1="340" x2="750" y2="340" stroke="#f5b833" stroke-width="2"/>

  <!-- subtitle -->
  <text x="600" y="390" font-family="Tahoma, Arial, sans-serif" font-size="22" fill="#a8adba" text-anchor="middle">من صفر خبرة الى أول عميل مدفوع</text>

  <!-- icon: layers/photoshop symbol -->
  <g transform="translate(600,470)">
    <rect x="-60" y="-30" width="90" height="60" rx="6" fill="none" stroke="#f5b833" stroke-width="2" transform="translate(10,-10)"/>
    <rect x="-70" y="-20" width="90" height="60" rx="6" fill="none" stroke="#f5b833" stroke-width="2" transform="translate(0,0)"/>
    <rect x="-80" y="-10" width="90" height="60" rx="6" fill="#171c2a" stroke="url(#goldGrad)" stroke-width="3" transform="translate(-10,10)"/>
  </g>

  <text x="600" y="580" font-family="Tahoma, Arial, sans-serif" font-size="18" fill="#a8adba" text-anchor="middle" letter-spacing="2">BELAL ECOMMERCE</text>
</svg>
